<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>మన జంతువులు — Mana Janubulu</title>
<style>
  :root{
    --sky-top:#FFD9C2; --sky-bottom:#FFE9D1;
    --grass:#8FC97A; --grass-dark:#5FA85A;
    --earth:#C99566; --house-wall:#F5C84B; --roof:#B8553A;
    --tree-leaves:#4A8B3F; --tree-trunk:#6B4423;
    --water:#7BB8D4; --temple-white:#F8F2E4;
    --accent-pink:#E89DA8; --text-warm:#5C3A21;
    --shresta-pink:#FFD1DC; --bounce:cubic-bezier(0.34,1.56,0.64,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:var(--sky-bottom);
    font-family:'Baloo 2','Hind Madurai','Noto Sans Telugu','Segoe UI',system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(#FFD9C2,#FFE9D1);}
  svg#scene{width:100%;height:100%;display:block;}

  /* ---- animal interaction wrappers ---- */
  .animal{transform-box:fill-box;transform-origin:center;cursor:pointer;}
  .animal .act{transform-box:fill-box;transform-origin:center;}
  .hit{fill:transparent;}
  .animal.react{animation:confirm .9s var(--bounce);}
  @keyframes confirm{0%{transform:scale(1)}22%{transform:scale(1.14)}55%{transform:scale(.98)}100%{transform:scale(1)}}

  /* idle subtle breathe (applied to a random animal at rest) */
  .animal.idle .act{animation:idleWiggle 1.6s ease-in-out;}
  @keyframes idleWiggle{0%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}55%{transform:rotate(2deg)}100%{transform:rotate(0)}}
  /* perk toward Shresta button */
  .animal.perk .act{animation:perk 1.4s ease-in-out;}
  @keyframes perk{0%{transform:rotate(0)}30%{transform:rotate(-7deg) translateY(-4px)}70%{transform:rotate(-7deg) translateY(-4px)}100%{transform:rotate(0)}}

  /* gentle ambient sway on tree canopy & some parts, always on */
  .breeze{transform-box:fill-box;transform-origin:center bottom;animation:breeze 6s ease-in-out infinite;}
  @keyframes breeze{0%{transform:rotate(0)}50%{transform:rotate(1.4deg)}100%{transform:rotate(0)}}
  .cloud{animation:drift 40s linear infinite;}
  .cloud.b{animation-duration:55s;}
  @keyframes drift{0%{transform:translateX(0)}50%{transform:translateX(26px)}100%{transform:translateX(0)}}
  .ripple{transform-box:fill-box;transform-origin:center;animation:ripple 4s ease-in-out infinite;}
  .ripple.b{animation-delay:1.3s;} .ripple.c{animation-delay:2.4s;}
  @keyframes ripple{0%{transform:scale(.6);opacity:.55}70%{opacity:.12}100%{transform:scale(1.25);opacity:0}}

  /* ===== signature tap animations ===== */
  .animal.react[data-id=cow] .tail{animation:cowtail 1.4s ease-in-out .1s;}
  @keyframes cowtail{0%,100%{transform:rotate(0)}30%{transform:rotate(22deg)}65%{transform:rotate(-16deg)}}
  .animal.react[data-id=cow] .act{animation:cowhead 1.4s ease-in-out .1s;}
  @keyframes cowhead{0%,100%{transform:rotate(0)}40%{transform:rotate(-4deg)}}

  .animal.react[data-id=dog] .act{animation:dogjump 1.4s var(--bounce) .1s;}
  @keyframes dogjump{0%{transform:translateY(0)}25%{transform:translateY(-34px)}50%{transform:translateY(0)}}
  .animal.react[data-id=dog] .tail{animation:wag .25s ease-in-out 6;}
  @keyframes wag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(20deg)}}

  .animal.react[data-id=cat] .act{animation:catstretch 1.4s ease-in-out .1s;}
  @keyframes catstretch{0%,100%{transform:scaleX(1) scaleY(1)}40%{transform:scaleX(1.22) scaleY(.9)}}
  .animal.react[data-id=cat] .eyes{animation:blink 1.4s ease-in-out .1s;}
  @keyframes blink{0%,38%,52%,100%{transform:scaleY(1)}45%{transform:scaleY(.1)}}

  .animal.react[data-id=goat] .act{animation:goathop 1.5s var(--bounce) .1s;}
  @keyframes goathop{0%,100%{transform:translateY(0)}18%{transform:translateY(-26px)}36%{transform:translateY(0)}54%{transform:translateY(-22px)}72%{transform:translateY(0)}}

  .animal.react[data-id=hen] .head{animation:peck .5s ease-in-out .1s 3;}
  @keyframes peck{0%,100%{transform:rotate(0)}50%{transform:rotate(26deg)}}
  .animal.react[data-id=hen] .chick{animation:chickhop .5s var(--bounce) .1s 3;}
  @keyframes chickhop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

  .animal.react[data-id=elephant] .trunk{animation:trunklift 1.6s ease-in-out .1s;}
  @keyframes trunklift{0%,100%{transform:rotate(0)}35%,70%{transform:rotate(-34deg)}}
  .animal.react[data-id=elephant] .ear{animation:earflap .5s ease-in-out .1s 3;}
  @keyframes earflap{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
  .animal.react[data-id=elephant] .spray{animation:spray 1.6s ease-out .1s;}
  @keyframes spray{0%{opacity:0;transform:translateY(0) scale(.4)}45%{opacity:.9;transform:translateY(-30px) scale(1)}100%{opacity:0;transform:translateY(-46px) scale(1.1)}}

  .animal.react[data-id=peacock] .fan{animation:fan 1.6s var(--bounce) .1s;}
  @keyframes fan{0%{transform:scale(.25);opacity:.4}50%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
  .animal.react[data-id=peacock] .fan{transform-origin:center bottom;}
  .animal[data-id=peacock] .fan{transform:scale(1);transition:none;}
  .animal.react[data-id=peacock] .shimmer{animation:shimmer 1.6s ease-in-out .1s;}
  @keyframes shimmer{0%,100%{opacity:.0}50%{opacity:.6}}

  .animal.react[data-id=monkey] .act{animation:swing 1.5s ease-in-out .1s;}
  @keyframes swing{0%,100%{transform:rotate(0) translateY(0)}30%{transform:rotate(8deg) translateY(10px)}60%{transform:rotate(-6deg) translateY(6px)}}
  .animal.react[data-id=monkey] .arm{animation:scratch .4s ease-in-out .6s 3;}
  @keyframes scratch{0%,100%{transform:rotate(0)}50%{transform:rotate(-20deg)}}

  .animal.react[data-id=fish] .act{animation:fishjump 1.5s var(--bounce) .1s;}
  @keyframes fishjump{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-70px) rotate(-18deg)}55%{transform:translateY(-60px) rotate(12deg)}100%{transform:translateY(0) rotate(0)}}
  .animal.react[data-id=fish] .splash{animation:splash 1.5s ease-out .1s;}
  @keyframes splash{0%{opacity:0;transform:scale(.4)}20%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.4)}}

  .animal.react[data-id=duck] .act{animation:waddle 1.5s ease-in-out .1s;}

  .animal.react[data-id=mouse] .act{animation:mouseup 1.3s var(--bounce) .1s;}
  @keyframes mouseup{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-18px) rotate(-16deg)}65%{transform:translateY(-18px) rotate(-16deg)}88%{transform:translateY(0) rotate(0)}}
  .animal.react[data-id=mouse] .tail{animation:tailswish .35s ease-in-out .1s 4;}
  @keyframes tailswish{0%,100%{transform:rotate(0)}50%{transform:rotate(-30deg)}}
  @keyframes waddle{0%,100%{transform:rotate(0)}20%{transform:rotate(7deg)}40%{transform:rotate(-7deg)}60%{transform:rotate(5deg)}80%{transform:rotate(-3deg)}}
  .animal.react[data-id=duck] .head{animation:dip .7s ease-in-out .4s 2;}
  @keyframes dip{0%,100%{transform:rotate(0)}50%{transform:rotate(34deg)}}

  /* spoken word bubble */
  #scene .wordbubble{opacity:0;transition:opacity .25s ease;}
  #scene .wordbubble.show{opacity:1;}
  text.word{font-family:'Baloo 2','Noto Sans Telugu',sans-serif;font-weight:700;fill:var(--text-warm);}

  /* ---- Shresta button ---- */
  #shresta{position:fixed;top:16px;left:16px;width:64px;height:64px;border:none;border-radius:50%;
    background:var(--shresta-pink);box-shadow:0 4px 12px rgba(180,85,58,.28),inset 0 0 0 3px rgba(255,255,255,.5);
    cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:30;
    animation:pulse 6s ease-in-out infinite;}
  #shresta svg{width:42px;height:42px;overflow:visible;}
  #shresta.bounce{animation:sbounce .25s var(--bounce);}
  @keyframes pulse{0%,100%{transform:scale(1)}8%{transform:scale(1.06)}16%{transform:scale(1)}}
  @keyframes sbounce{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
  .floatheart{position:fixed;z-index:31;pointer-events:none;font-size:26px;color:var(--accent-pink);
    animation:fheart 1.1s ease-out forwards;}
  @keyframes fheart{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-90px) scale(1.1)}}

  /* ---- mute toggle ---- */
  #mute{position:fixed;top:18px;right:16px;width:48px;height:48px;border:none;border-radius:50%;
    background:rgba(255,255,255,.55);box-shadow:0 3px 8px rgba(180,85,58,.2);cursor:pointer;z-index:30;
    display:flex;align-items:center;justify-content:center;color:var(--text-warm);}
  #mute svg{width:24px;height:24px;}

  /* ---- splash ---- */
  #splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:30px;background:radial-gradient(circle at 50% 38%,#FFE9D1,#FFD0B8);cursor:pointer;transition:opacity .6s ease;}
  #splash.hide{opacity:0;pointer-events:none;}
  #splash .title{font-size:clamp(40px,8vw,84px);font-weight:800;color:var(--text-warm);text-align:center;line-height:1.05;}
  #splash .sub{font-size:clamp(16px,3vw,24px);color:#9a6b46;letter-spacing:.5px;}
  #splash .tapcircle{width:128px;height:128px;border-radius:50%;background:var(--shresta-pink);
    display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(180,85,58,.3);
    animation:pulse 2.4s ease-in-out infinite;}
  #splash .tapcircle svg{width:74px;height:74px;}
  #splash .hint{font-size:clamp(15px,2.6vw,20px);color:#b07a52;}

  /* ---- portrait lock ---- */
  #rotate{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;background:#FFE9D1;color:var(--text-warm);text-align:center;padding:30px;}
  #rotate svg{width:90px;height:90px;animation:rot 2.4s ease-in-out infinite;}
  @keyframes rot{0%,100%{transform:rotate(0)}50%{transform:rotate(-90deg)}}
  #rotate p{font-size:22px;font-weight:600;}
  @media (max-aspect-ratio:1/1){#rotate{display:flex;}#stage{filter:blur(2px);}}

  /* welcome transition message */
  #splash .welcome{display:flex;flex-direction:column;align-items:center;gap:16px;
    animation:welcomeIn .55s var(--bounce);}
  @keyframes welcomeIn{0%{opacity:0;transform:scale(.75) translateY(14px)}100%{opacity:1;transform:scale(1) translateY(0)}}
  #splash .w-main{font-size:clamp(46px,9vw,96px);font-weight:800;color:var(--text-warm);line-height:1.1;text-align:center;}
  #splash .w-sub{font-size:clamp(22px,4vw,42px);font-weight:600;color:#8a5a3a;text-align:center;}
  #splash .w-rom{font-size:clamp(13px,2vw,18px);color:#b08050;letter-spacing:.06em;margin-top:4px;opacity:.85;}

  @media (prefers-reduced-motion:reduce){
    .breeze,.cloud,.ripple,#shresta,#splash .tapcircle{animation:none!important;}
  }
</style>
</head>
<body>
<div id="stage">
<svg id="scene" viewBox="0 0 1024 768" preserveAspectRatio="xMidYMid meet" aria-label="A South Indian village scene with animals">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD9C2"/><stop offset="1" stop-color="#FFE9D1"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6E6"/><stop offset="1" stop-color="#FFE3C0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grassG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ED389"/><stop offset="1" stop-color="#7CBE6A"/>
    </linearGradient>
    <radialGradient id="pondG" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#9BD0E6"/><stop offset="1" stop-color="#6FAFCD"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#7a4a28" flood-opacity="0.18"/>
    </filter>
    <filter id="softsm" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7a4a28" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- ===================== BACKGROUND ===================== -->
  <rect x="0" y="0" width="1024" height="540" fill="url(#sky)"/>
  <circle cx="430" cy="140" r="200" fill="url(#sun)"/>

  <!-- clouds -->
  <g class="cloud" fill="#FFF8EF" opacity="0.95">
    <ellipse cx="210" cy="115" rx="58" ry="34"/><ellipse cx="260" cy="120" rx="46" ry="28"/><ellipse cx="170" cy="128" rx="40" ry="24"/>
  </g>
  <g class="cloud b" fill="#FFFBF4" opacity="0.9">
    <ellipse cx="660" cy="92" rx="50" ry="30"/><ellipse cx="704" cy="98" rx="40" ry="24"/><ellipse cx="624" cy="102" rx="34" ry="20"/>
  </g>

  <!-- hill + temple (right) -->
  <g filter="url(#soft)">
    <path d="M640 470 Q860 250 1024 360 L1024 540 L640 540 Z" fill="#A9C98A"/>
    <path d="M760 470 Q930 320 1024 408 L1024 540 L760 540 Z" fill="#8FB873"/>
    <!-- temple -->
    <g transform="translate(884,300)">
      <rect x="-44" y="34" width="88" height="56" rx="6" fill="var(--temple-white)" stroke="#E7Dcc6" stroke-width="2"/>
      <rect x="-12" y="58" width="24" height="32" rx="4" fill="#D9A05B"/>
      <path d="M-52 34 L0 -16 L52 34 Z" fill="#E7B96A"/>
      <path d="M-30 -8 L0 -40 L30 -8 Z" fill="#D98C4A"/>
      <circle cx="0" cy="-46" r="7" fill="#F2C14E"/>
      <rect x="-2.5" y="-62" width="5" height="14" rx="2" fill="#F2C14E"/>
    </g>
  </g>

  <!-- ground bands -->
  <rect x="0" y="500" width="1024" height="268" fill="url(#grassG)"/>
  <path d="M0 512 Q260 490 520 510 T1024 506 L1024 560 L0 560 Z" fill="#86C870" opacity="0.6"/>
  <ellipse cx="430" cy="690" rx="360" ry="50" fill="var(--grass-dark)" opacity="0.25"/>

  <!-- pond (bottom-left) -->
  <g filter="url(#softsm)">
    <ellipse cx="195" cy="660" rx="170" ry="78" fill="url(#pondG)"/>
    <ellipse cx="195" cy="660" rx="170" ry="78" fill="none" stroke="#5C9BBA" stroke-width="3" opacity="0.5"/>
    <g stroke="#EAF6FB" stroke-width="3" fill="none" opacity="0.7">
      <ellipse class="ripple" cx="150" cy="648" rx="34" ry="14"/>
      <ellipse class="ripple b" cx="240" cy="678" rx="30" ry="13"/>
      <ellipse class="ripple c" cx="195" cy="660" rx="44" ry="18"/>
    </g>
  </g>

  <!-- neem tree (left) -->
  <g filter="url(#soft)">
    <path d="M150 560 Q138 430 152 350 Q160 430 168 560 Z" fill="var(--tree-trunk)"/>
    <rect x="146" y="470" width="26" height="92" rx="10" fill="var(--tree-trunk)"/>
    <path d="M150 470 Q120 452 96 470" stroke="var(--tree-trunk)" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M168 430 Q210 410 246 432" stroke="var(--tree-trunk)" stroke-width="13" fill="none" stroke-linecap="round"/>
    <g class="breeze">
      <ellipse cx="150" cy="250" rx="120" ry="96" fill="var(--tree-leaves)"/>
      <ellipse cx="92" cy="290" rx="74" ry="62" fill="#3F7C35"/>
      <ellipse cx="216" cy="288" rx="80" ry="66" fill="#56A047"/>
      <ellipse cx="150" cy="210" rx="86" ry="70" fill="#56A047"/>
      <ellipse cx="118" cy="250" rx="40" ry="34" fill="#62B051" opacity="0.7"/>
    </g>
  </g>

  <!-- village house (centre-right) -->
  <g filter="url(#soft)">
    <rect x="596" y="338" width="252" height="206" rx="8" fill="var(--house-wall)"/>
    <rect x="596" y="338" width="252" height="206" rx="8" fill="#000" opacity="0.04"/>
    <!-- roof -->
    <path d="M572 344 L722 256 L872 344 Z" fill="var(--roof)"/>
    <g stroke="#9c4631" stroke-width="3" opacity="0.55">
      <path d="M596 330 L722 256 L848 330" fill="none"/>
      <path d="M618 318 L722 270" fill="none"/><path d="M826 318 L722 270" fill="none"/>
    </g>
    <!-- door -->
    <rect x="690" y="430" width="64" height="114" rx="6" fill="#8a5a36"/>
    <rect x="698" y="438" width="48" height="106" rx="4" fill="#6f4527"/>
    <circle cx="736" cy="492" r="4" fill="#f2c14e"/>
    <!-- window -->
    <rect x="788" y="392" width="44" height="44" rx="5" fill="#cfa23e"/>
    <path d="M810 392 V436 M788 414 H832" stroke="#8a6a22" stroke-width="3"/>
    <!-- tulasi pot near house -->
    <g transform="translate(636,520)">
      <path d="M-16 0 L16 0 L12 26 L-12 26 Z" fill="#C0703F"/>
      <rect x="-20" y="-6" width="40" height="10" rx="3" fill="#D98C4A"/>
      <g class="breeze"><path d="M0 -4 Q-14 -28 -6 -44 Q2 -30 0 -4" fill="#4A8B3F"/>
      <path d="M0 -4 Q14 -26 8 -46 Q-2 -28 0 -4" fill="#56A047"/>
      <path d="M0 -2 Q0 -34 0 -50" stroke="#3F7C35" stroke-width="3" fill="none"/></g>
    </g>
  </g>

  <!-- compound wall (front of house) -->
  <g filter="url(#softsm)">
    <rect x="470" y="496" width="392" height="58" rx="6" fill="#E8C98A"/>
    <rect x="470" y="496" width="392" height="14" rx="6" fill="#F0D9A6"/>
    <g stroke="#cdaa6e" stroke-width="2.5" opacity="0.7">
      <path d="M470 525 H862"/>
      <path d="M520 510 V525 M580 525 V554 M640 510 V525 M700 525 V554 M760 510 V525 M820 525 V554"/>
    </g>
  </g>

  <!-- little flowers + water pot -->
  <g>
    <g transform="translate(360,560)"><circle r="7" fill="var(--accent-pink)"/><circle r="3" fill="#F6D24E"/>
      <g fill="var(--accent-pink)"><circle cx="0" cy="-9" r="4"/><circle cx="8" cy="-3" r="4"/><circle cx="5" cy="7" r="4"/><circle cx="-5" cy="7" r="4"/><circle cx="-8" cy="-3" r="4"/></g></g>
    <g transform="translate(905,560) scale(0.9)"><circle r="7" fill="#fff" stroke="#eee"/><circle r="3" fill="#F6D24E"/>
      <g fill="#fff"><circle cx="0" cy="-9" r="4"/><circle cx="8" cy="-3" r="4"/><circle cx="5" cy="7" r="4"/><circle cx="-5" cy="7" r="4"/><circle cx="-8" cy="-3" r="4"/></g></g>
    <!-- water pot at pond edge -->
    <g transform="translate(338,704)" filter="url(#softsm)">
      <path d="M-22 -20 Q-30 6 -16 22 L16 22 Q30 6 22 -20 Q10 -30 -10 -30 Q-22 -28 -22 -20 Z" fill="#B5633A"/>
      <ellipse cx="0" cy="-22" rx="16" ry="6" fill="#8a4a28"/>
      <path d="M-22 -8 Q0 0 22 -8" stroke="#8a4a28" stroke-width="3" fill="none" opacity="0.6"/>
    </g>
  </g>

  <!-- ===================== ANIMALS ===================== -->

  <!-- MONKEY on tree branch -->
  <g class="animal" data-id="monkey" data-bx="232" data-by="346" transform="translate(232,402)">
    <rect class="hit" x="-60" y="-70" width="120" height="150"/>
    <g class="act">
      <!-- arm holding branch -->
      <path class="arm" d="M-2 -34 Q-26 -50 -34 -36" stroke="#7a5230" stroke-width="11" fill="none" stroke-linecap="round" style="transform-box:fill-box;transform-origin:right;"/>
      <ellipse cx="0" cy="6" rx="26" ry="32" fill="#8a5e38"/>
      <ellipse cx="0" cy="14" rx="16" ry="20" fill="#E8C79A"/>
      <circle cx="0" cy="-30" r="24" fill="#8a5e38"/>
      <ellipse cx="0" cy="-26" rx="16" ry="14" fill="#E8C79A"/>
      <circle cx="-22" cy="-34" r="9" fill="#8a5e38"/><circle cx="22" cy="-34" r="9" fill="#8a5e38"/>
      <circle cx="-8" cy="-30" r="4" fill="#3a2a1a"/><circle cx="8" cy="-30" r="4" fill="#3a2a1a"/>
      <circle cx="-7" cy="-31" r="1.4" fill="#fff"/><circle cx="9" cy="-31" r="1.4" fill="#fff"/>
      <ellipse cx="0" cy="-20" rx="3" ry="2" fill="#5a3a22"/>
      <path d="M-7 -15 Q0 -11 7 -15" stroke="#5a3a22" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M22 24 Q52 24 50 -6" stroke="#7a5230" stroke-width="7" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- CAT on wall -->
  <g class="animal" data-id="cat" data-bx="516" data-by="426" transform="translate(516,470)">
    <rect class="hit" x="-52" y="-52" width="104" height="96"/>
    <g class="act">
      <path d="M22 26 Q56 18 44 -10" stroke="#9a9a9a" stroke-width="9" fill="none" stroke-linecap="round"/>
      <ellipse cx="0" cy="8" rx="30" ry="24" fill="#A7A7A7"/>

<script>

  "use strict";
  const NS="http://www.w3.org/2000/svg";

  const ANIMALS={

    dog:     {te:"కుక్క", say:"కుక్క", sound:"woof"},
    cat:     {te:"పిల్లి", say:"పిల్లి", sound:"meow"},
    goat:    {te:"మేక",   say:"మేక",   sound:"bleat"},
    hen:     {te:"కోడి",  say:"కోడి",  sound:"cluck"},
    elephant:{te:"ఏనుగు", say:"ఏనుగు", sound:"trumpet"},
    peacock: {te:"నెమలి", say:"నెమలి", sound:"peacock"},
    monkey:  {te:"కోతి",  say:"కోతి",  sound:"chatter"},
    fish:    {te:"చేప",   say:"చేప",   sound:"splash"},
    duck:    {te:"బాతు",  say:"బాతు",  sound:"quack"},
    mouse:   {te:"ఎలుక",  say:"ఎలుక",  sound:"squeak"}
  };
  const SHRESTA=["శ్రేష్ట!"];

  /* ---------- build peacock feather fan ---------- */
  (function buildFan(){
    const g=document.getElementById("feathers");
    if(!g) return;
    const cols=["#1F7A8C","#2E9CB0","#15616D","#3AB0C4"];
    for(let i=-4;i<=4;i++){
      const a=i*15*Math.PI/180;
      const len=92, ex=Math.sin(a)*len, ey=30-Math.cos(a)*len;
      const path=document.createElementNS(NS,"path");
      path.setAttribute("d",`M0 30 Q${ex*0.4} ${30-len*0.55} ${ex} ${ey}`);
      path.setAttribute("stroke",cols[(i+4)%cols.length]);
      path.setAttribute("stroke-width","6"); path.setAttribute("fill","none"); path.setAttribute("stroke-linecap","round");
      g.appendChild(path);
      // eye spot
      const c=document.createElementNS(NS,"circle");
      c.setAttribute("cx",ex); c.setAttribute("cy",ey); c.setAttribute("r","9"); c.setAttribute("fill","#1F5A6B");
      g.appendChild(c);
      const c2=document.createElementNS(NS,"circle");
      c2.setAttribute("cx",ex); c2.setAttribute("cy",ey); c2.setAttribute("r","5"); c2.setAttribute("fill","#3AB0C4");
      g.appendChild(c2);
      const c3=document.createElementNS(NS,"circle");
      c3.setAttribute("cx",ex); c3.setAttribute("cy",ey); c3.setAttribute("r","2.4"); c3.setAttribute("fill","#0E3A44");
      g.appendChild(c3);
    }
  })();

  /* ---------- audio: web audio synth ---------- */
  let AC=null, muted=false, master=null;
  function ensureAC(){
    if(!AC){
      try{ AC=new (window.AudioContext||window.webkitAudioContext)();
        master=AC.createGain(); master.gain.value=0.9; master.connect(AC.destination);
      }catch(e){}
    }
    if(AC&&AC.state==="suspended") AC.resume();
    return AC;
  }
  function tone(opts){
    if(!AC||muted) return null;
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=opts.type||"sine";
    o.frequency.setValueAtTime(opts.f0, AC.currentTime+(opts.t0||0));
    if(opts.f1!=null) o.frequency.exponentialRampToValueAtTime(Math.max(1,opts.f1), AC.currentTime+(opts.t0||0)+opts.dur);
    const peak=opts.gain==null?0.3:opts.gain;
    g.gain.setValueAtTime(0.0001, AC.currentTime+(opts.t0||0));
    g.gain.exponentialRampToValueAtTime(peak, AC.currentTime+(opts.t0||0)+0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+(opts.t0||0)+opts.dur);
    let node=o;
    if(opts.filter){ const f=AC.createBiquadFilter(); f.type=opts.filter; f.frequency.value=opts.filterF||800; node.connect(f); f.connect(g);}
    else node.connect(g);
    g.connect(master);
    o.start(AC.currentTime+(opts.t0||0)); o.stop(AC.currentTime+(opts.t0||0)+opts.dur+0.05);
    return o;
  }
  function noise(t0,dur,gain,filterF){
    if(!AC||muted) return;
    const len=Math.floor(AC.sampleRate*dur);
    const buf=AC.createBuffer(1,len,AC.sampleRate); const d=buf.getChannelData(0);
    for(let i=0;i<len;i++){d[i]=(Math.random()*2-1);}
    const src=AC.createBufferSource(); src.buffer=buf;
    const f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=filterF||1200; f.Q.value=0.8;
    const g=AC.createGain();
    g.gain.setValueAtTime(0.0001,AC.currentTime+t0);
    g.gain.exponentialRampToValueAtTime(gain||0.25,AC.currentTime+t0+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+t0+dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(AC.currentTime+t0); src.stop(AC.currentTime+t0+dur+0.02);
  }
  const SOUNDS={
    moo(){ tone({type:"sawtooth",f0:180,f1:120,dur:0.9,gain:0.22,filter:"lowpass",filterF:600}); },
    woof(){ tone({type:"square",f0:260,f1:150,dur:0.16,gain:0.22,filter:"lowpass",filterF:900});
            tone({type:"square",f0:240,f1:140,dur:0.18,gain:0.2,filter:"lowpass",filterF:900,t0:0.26}); },
    meow(){ tone({type:"sawtooth",f0:520,f1:760,dur:0.28,gain:0.16,filter:"bandpass",filterF:900});
            tone({type:"sawtooth",f0:760,f1:430,dur:0.4,gain:0.16,filter:"bandpass",filterF:900,t0:0.28}); },
    bleat(){ for(let i=0;i<6;i++) tone({type:"sawtooth",f0:430,f1:400,dur:0.06,gain:0.14,filter:"bandpass",filterF:1200,t0:i*0.07}); },
    cluck(){ tone({type:"square",f0:900,f1:500,dur:0.08,gain:0.16,t0:0});
             tone({type:"square",f0:820,f1:480,dur:0.08,gain:0.15,t0:0.16}); noise(0.02,0.05,0.12,2000); },
    trumpet(){ tone({type:"sawtooth",f0:300,f1:560,dur:0.5,gain:0.2,filter:"bandpass",filterF:700});
               tone({type:"sawtooth",f0:560,f1:480,dur:0.4,gain:0.18,filter:"bandpass",filterF:700,t0:0.5}); },
    peacock(){ tone({type:"sawtooth",f0:700,f1:900,dur:0.18,gain:0.16,filter:"bandpass",filterF:1400,t0:0});
               tone({type:"sawtooth",f0:650,f1:880,dur:0.2,gain:0.16,filter:"bandpass",filterF:1400,t0:0.32}); },
    chatter(){ for(let i=0;i<7;i++) tone({type:"square",f0:600+Math.random()*500,dur:0.05,gain:0.12,t0:i*0.09}); },
    splash(){ noise(0,0.35,0.3,1400); noise(0.05,0.25,0.18,2600); },
    quack(){ tone({type:"sawtooth",f0:380,f1:260,dur:0.16,gain:0.2,filter:"bandpass",filterF:1100,t0:0});
             tone({type:"sawtooth",f0:360,f1:240,dur:0.16,gain:0.18,filter:"bandpass",filterF:1100,t0:0.22}); },
    squeak(){ [0,0.14,0.28].forEach(t=>tone({type:"sine",f0:1600,f1:2100,dur:0.07,gain:0.14,t0:t})); }
  };

  /* ---------- narration: speech synthesis ---------- */
  let teVoice=null, hiVoice=null;
  function pickVoice(){
    const v=window.speechSynthesis?speechSynthesis.getVoices():[];
    teVoice = v.find(x=>/^te(-|_|$)/i.test(x.lang)) || null;
    hiVoice = v.find(x=>/^hi(-|_|$)/i.test(x.lang)) || null;
  }
  if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
  // speak animal names in Telugu
  function speak(text){
    if(muted||!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="te-IN"; if(teVoice) u.voice=teVoice;
    u.rate=0.86; u.pitch=1.18; u.volume=1;
    speechSynthesis.speak(u);
  }
  // speak welcome in Hindi (better TTS coverage on most devices)
  function speakHi(text){
    if(muted||!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="hi-IN"; if(hiVoice) u.voice=hiVoice;
    u.rate=0.82; u.pitch=1.12; u.volume=1;
    speechSynthesis.speak(u);
  }
  function stopSpeech(){ if(window.speechSynthesis) speechSynthesis.cancel(); }

  /* ---------- word bubble ---------- */
  const scene=document.getElementById("scene");
  const wb=document.getElementById("wordbubble"), wbBg=document.getElementById("wb-bg"), wbText=document.getElementById("wb-text");
  let wbTimer=null;
  function showWord(text, g){
    // anchor stored directly in scene (viewBox) coords on each animal
    const sceneCx=parseFloat(g.getAttribute("data-bx"))||512;
    const sceneTop=parseFloat(g.getAttribute("data-by"))||400;
    wbText.textContent=text;
    const w=text.length*40+44, h=58;
    let x=sceneCx-w/2; x=Math.max(8,Math.min(1024-w-8,x));
    let y=sceneTop-h-12; if(y<8) y=sceneTop+120;
    wbBg.setAttribute("x",x); wbBg.setAttribute("y",y); wbBg.setAttribute("width",w); wbBg.setAttribute("height",h);
    wbText.setAttribute("x",x+w/2); wbText.setAttribute("y",y+h/2+13);
    wb.classList.add("show");
    clearTimeout(wbTimer);
    wbTimer=setTimeout(()=>{ wb.classList.remove("show"); }, 2200);
  }

  /* ---------- tap sequence ---------- */
  let activeGroup=null, seqTimers=[];
  function clearTimers(){ seqTimers.forEach(clearTimeout); seqTimers=[]; }

  function playAnimal(g){
    const id=g.getAttribute("data-id"); const a=ANIMALS[id]; if(!a) return;
    resetIdle();
    ensureAC();
    // interrupt previous
    stopSpeech(); clearTimers();
    if(activeGroup&&activeGroup!==g){ activeGroup.classList.remove("react","idle","perk"); }
    activeGroup=g;
    g.classList.remove("idle","perk");
    // re-trigger react
    g.classList.remove("react"); void g.offsetWidth; g.classList.add("react");
    // sound at +100ms
    seqTimers.push(setTimeout(()=>{ if(SOUNDS[a.sound]) SOUNDS[a.sound](); }, 100));
    // word bubble + narration after animation (~1.6s)
    showWord(a.te, g);
    seqTimers.push(setTimeout(()=>{ speak(a.say); }, 1600));
    seqTimers.push(setTimeout(()=>{ g.classList.remove("react"); }, 1500));
  }

  document.querySelectorAll(".animal").forEach(g=>{
    const id=g.getAttribute("data-id");
    g.setAttribute("role","button");
    g.setAttribute("aria-label",(ANIMALS[id]?ANIMALS[id].te:"")+" — "+id);
    g.setAttribute("tabindex","0");
    g.addEventListener("pointerdown",e=>{ e.preventDefault(); playAnimal(g); });
    g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); playAnimal(g);} });
  });

  /* ---------- Shresta button ---------- */
  const sbtn=document.getElementById("shresta");
  function shrestaCall(){
    resetIdle(); ensureAC();
    sbtn.classList.remove("bounce"); void sbtn.offsetWidth; sbtn.classList.add("bounce");
    // soft chime
    if(AC&&!muted){ tone({type:"sine",f0:660,f1:990,dur:0.18,gain:0.12,t0:0}); tone({type:"sine",f0:880,dur:0.3,gain:0.1,t0:0.16}); }
    stopSpeech();
    setTimeout(()=>speak(SHRESTA[Math.floor(Math.random()*SHRESTA.length)]),120);
    // floating heart
    const r=sbtn.getBoundingClientRect();
    const h=document.createElement("div"); h.className="floatheart"; h.textContent="♥";
    h.style.left=(r.left+r.width/2-13)+"px"; h.style.top=(r.top+6)+"px";
    document.body.appendChild(h); setTimeout(()=>h.remove(),1100);
  }
  sbtn.addEventListener("pointerdown",e=>{ e.preventDefault(); shrestaCall(); });

  /* ---------- mute ---------- */
  const mbtn=document.getElementById("mute");
  mbtn.addEventListener("pointerdown",e=>{ e.preventDefault();
    muted=!muted;
    document.getElementById("mute-on").style.display=muted?"none":"block";
    document.getElementById("mute-off").style.display=muted?"block":"none";
    if(muted) stopSpeech();
  });

  /* ---------- idle behaviour ---------- */
  let idle8=null, idle20=null;
  const ids=Object.keys(ANIMALS);
  function randAnimalGroup(){ const id=ids[Math.floor(Math.random()*ids.length)]; return document.querySelector('.animal[data-id="'+id+'"]'); }
  function resetIdle(){
    clearTimeout(idle8); clearTimeout(idle20);
    idle8=setTimeout(()=>{
      const g=randAnimalGroup(); if(g){ g.classList.remove("idle"); void g.offsetWidth; g.classList.add("idle");
        setTimeout(()=>g.classList.remove("idle"),1700); }
    },8000);
    idle20=setTimeout(()=>{
      // village calls Shresta — silent, just the heart float
      if(AC&&!muted){ tone({type:"sine",f0:660,f1:990,dur:0.18,gain:0.12,t0:0}); tone({type:"sine",f0:880,dur:0.3,gain:0.1,t0:0.16}); }
      const g=randAnimalGroup(); if(g){ g.classList.remove("perk"); void g.offsetWidth; g.classList.add("perk");
        setTimeout(()=>g.classList.remove("perk"),1500); }
      resetIdle();
    },20000);
  }

  /* ---------- splash / unlock ---------- */
  const splash=document.getElementById("splash");
  function unlock(){
    ensureAC();
    if(window.speechSynthesis){ try{ const w=new SpeechSynthesisUtterance(" "); w.volume=0; speechSynthesis.speak(w);}catch(e){} pickVoice(); }
    // swap splash content to welcome message
    splash.innerHTML=`
      <div class="welcome">
        <div class="w-main">రా శ్రేష్ట!</div>
        <div class="w-sub">జంతువులని చూద్దామా</div>
        <div class="w-rom">Raa Shresta · Janthuvulani Chuddama</div>
      </div>`;
    // remove the 🌸 for TTS, speak just the Telugu
    setTimeout(()=>speak("రా శ్రేష్ట! జంతువులని చూద్దామా!"),260);
    // fade out after welcome is read
    setTimeout(()=>{
      splash.classList.add("hide");
      setTimeout(()=>{ try{splash.remove();}catch(e){} },700);
      resetIdle();
    },2400);
  }
  splash.addEventListener("pointerdown",e=>{ e.preventDefault(); unlock(); });

  // global activity resets idle
  ["pointerdown"].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));
})();
</script>
